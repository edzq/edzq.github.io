---
layout: default
---

{% include base_path %}

<div id="main" role="main" class="post-main">
  <article class="post-single">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      {% if page.subtitle %}<div class="post-meta">{{ page.subtitle }}</div>{% endif %}
    </header>

    <div class="post-content">
      {{ content }}
    </div>
  </article>
</div>
